[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maido"
version = "0.1.0"
description = "Core-video-anchored multi-video composition tooling"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "moviepy>=1.0.3"
]

[project.scripts]
maido = "maido.cli.main:main"

[tool.setuptools.packages.find]
include = ["maido*"]
